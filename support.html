<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعم - منصة ملخصاتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 dark:bg-neutral-900 dark:text-gray-100">
    <header class="border-b border-gray-200 bg-white dark:border-neutral-800 dark:bg-neutral-900">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
            <a href="index.html" class="font-serif text-xl font-bold">ملخصاتي</a>
            <button id="themeToggle" type="button" class="rounded-full border border-gray-200 px-3 py-1.5 text-xs dark:border-neutral-700">🌙</button>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
        <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm dark:border-neutral-800 dark:bg-neutral-900">
            <h1 class="text-lg font-bold">الدعم والمقترحات</h1>
            <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">اكتب اقتراحك أو أي ملاحظة تريد أن تراها الإدارة، وسيظهر هذا الطلب في لوحة الإدارة.</p>

            <form id="supportForm" class="mt-5 space-y-4">
                <label class="block text-xs font-medium">
                    الاسم
                    <input id="supportName" type="text" class="mt-1 w-full rounded-md border border-gray-200 bg-gray-50 p-2.5 text-xs outline-none dark:border-neutral-700 dark:bg-neutral-800" placeholder="الاسم أو اسم المستخدم">
                </label>

                <label class="block text-xs font-medium">
                    الرسالة / الاقتراح
                    <textarea id="supportText" rows="5" required maxlength="800" class="mt-1 w-full resize-none rounded-md border border-gray-200 bg-gray-50 p-3 text-xs outline-none dark:border-neutral-700 dark:bg-neutral-800" placeholder="اكتب اقتراحك أو ملاحظتك..."></textarea>
                </label>

                <div class="flex items-center justify-between gap-3">
                    <span id="supportStatus" class="text-[10px] text-gray-500" role="status"></span>
                    <button type="submit" class="rounded-md bg-gray-900 px-4 py-2.5 text-xs font-bold text-white dark:bg-gray-100 dark:text-gray-900">إرسال الدعم</button>
                </div>
            </form>
        </section>

        <section class="mt-6 rounded-xl border border-gray-200 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-900">
            <h2 class="text-sm font-bold">آخر الرسائل</h2>
            <div id="supportMessagesList" class="mt-4 space-y-3"></div>
        </section>
    </main>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: 'AIzaSyByDS_xwe-nZQWlWTMUgRex4ITMPWtGRKQ',
            authDomain: 'molakhasat-web.firebaseapp.com',
            projectId: 'molakhasat-web',
            messagingSenderId: '87734758041',
            appId: '1:87734758041:web:22251786db9b0aee2fa608'
        };
        const firebaseConfigured = Object.values(FIREBASE_CONFIG).every(value => !value.includes('ضع_'));
        let db = null;
        if (firebaseConfigured) {
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.firestore();
        }

        const currentUser = JSON.parse(localStorage.getItem('current_user') || 'null');
        const supportNameInput = document.getElementById('supportName');
        const supportTextInput = document.getElementById('supportText');
        const supportStatus = document.getElementById('supportStatus');
        const supportMessagesList = document.getElementById('supportMessagesList');

        if (currentUser) {
            supportNameInput.value = currentUser.name || '';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        function getSupportMessages() {
            try {
                return JSON.parse(localStorage.getItem('support_messages') || '[]');
            } catch (_) {
                return [];
            }
        }

        function renderSupportMessages(messages) {
            if (!messages.length) {
                supportMessagesList.innerHTML = '<p class="text-xs text-gray-500">لا توجد رسائل دعم بعد.</p>';
                return;
            }

            supportMessagesList.innerHTML = messages.slice(0, 8).map(item => `
                <article class="rounded-lg border border-gray-200 p-3 dark:border-neutral-700">
                    <div class="flex items-center justify-between gap-2">
                        <strong class="text-xs">${escapeHtml(item.name || 'مستخدم')}</strong>
                        <time class="text-[10px] text-gray-400">${escapeHtml(new Date(item.createdAt || Date.now()).toLocaleString('ar-EG'))}</time>
                    </div>
                    <p class="mt-2 whitespace-pre-wrap break-words text-xs leading-relaxed text-gray-700 dark:text-gray-300">${escapeHtml(item.text || '')}</p>
                </article>
            `).join('');
        }

        async function loadSupportMessages() {
            let messages = getSupportMessages();
            if (db) {
                try {
                    const snapshot = await db.collection('support_messages').orderBy('createdAt', 'desc').limit(20).get();
                    const firebaseMessages = [];
                    snapshot.forEach(doc => firebaseMessages.push({ id: doc.id, ...doc.data() }));
                    if (firebaseMessages.length) {
                        const merged = [...firebaseMessages, ...messages.filter(item => !firebaseMessages.some(msg => msg.id === item.id))];
                        localStorage.setItem('support_messages', JSON.stringify(merged));
                        messages = merged;
                    }
                } catch (error) {
                    console.error('تعذر جلب رسائل الدعم:', error);
                }
            }
            renderSupportMessages(messages);
        }

        document.getElementById('supportForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const text = supportTextInput.value.trim();
            const name = (supportNameInput.value || currentUser?.name || 'مستخدم').trim();
            if (!text) {
                supportStatus.textContent = 'اكتب الرسالة أو الاقتراح قبل الإرسال.';
                return;
            }

            const message = {
                id: 'support_' + Date.now(),
                name,
                text,
                createdAt: new Date().toISOString(),
                userId: currentUser ? currentUser.id : null,
                authorPhotoURL: currentUser ? (currentUser.photoURL || currentUser.image || currentUser.avatarURL || '') : ''
            };

            const existing = getSupportMessages();
            existing.unshift(message);
            localStorage.setItem('support_messages', JSON.stringify(existing));
            renderSupportMessages(existing);

            if (db) {
                try {
                    await db.collection('support_messages').doc(message.id).set(message);
                } catch (error) {
                    console.error('تعذر حفظ اقتراح الدعم في Firebase:', error);
                }
            }

            supportForm.reset();
            if (currentUser) supportNameInput.value = currentUser.name || '';
            supportStatus.textContent = 'تم إرسال دعمك بنجاح.';
        });

        document.getElementById('themeToggle').addEventListener('click', function () {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            this.textContent = isDark ? '☀️' : '🌙';
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('themeToggle').textContent = '☀️';
        }

        loadSupportMessages();
    </script>
</body>
</html>
