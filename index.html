    <style>
        :root {
            --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --motion-fast: 220ms;
            --motion-medium: 280ms;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        a, button, input, select, textarea {
            transition: transform var(--motion-fast) var(--motion-ease),
                        opacity var(--motion-fast) var(--motion-ease),
                        background-color 180ms ease,
                        border-color 180ms ease,
                        box-shadow 180ms ease,
                        color 180ms ease;
        }

        button:hover,
        a:hover,
        .sidebar-action:hover,
        [data-sidebar-item]:hover {
            transform: translateY(-1px);
        }

        button:active,
        a:active,
        .sidebar-action:active,
        [data-sidebar-item]:active {
            transform: scale(0.98);
        }

        .menu-toggle {
            transform-origin: center;
        }

        .sidebar-overlay {
            transition: opacity 260ms var(--motion-ease), visibility 260ms var(--motion-ease);
            will-change: opacity;
        }

        .sidebar-overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .sidebar-animated {
            transition: transform 280ms var(--motion-ease), opacity 260ms var(--motion-ease), visibility 260ms var(--motion-ease);
            will-change: transform, opacity;
        }

        .sidebar-item-enter {
            opacity: 0;
            transform: translateX(10px);
            animation: sidebarItemIn 260ms var(--motion-ease) forwards;
        }

        .sidebar-item-enter:nth-child(2) { animation-delay: 30ms; }
        .sidebar-item-enter:nth-child(3) { animation-delay: 60ms; }
        .sidebar-item-enter:nth-child(4) { animation-delay: 90ms; }

        @keyframes sidebarItemIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-up {
            animation: fadeUp 260ms var(--motion-ease) both;
        }

        .discover-users-list {
            scrollbar-width: thin;
            scrollbar-color: #6b7280 transparent;
            touch-action: pan-x;
        }

        .post-composer-backdrop {
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .post-composer-backdrop.is-open {
            opacity: 1;
        }

        .post-composer-panel {
            transform: translateY(18px);
            transition: transform 220ms var(--motion-ease);
        }

        .post-composer-backdrop.is-open .post-composer-panel {
            transform: translateY(0);
        }

        .like-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(148, 163, 184, 0.75);
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,250,252,0.96));
            color: #334155;
            border-radius: 9999px;
            padding: 0.45rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
            isolation: isolate;
        }

        .dark .like-button {
            background: linear-gradient(135deg, rgba(23,23,23,0.98), rgba(38,38,38,0.96));
            color: #e5e7eb;
            border-color: rgba(82, 82, 91, 0.9);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }

        .like-button .like-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.55rem;
            height: 1.55rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            font-size: 0.9rem;
            line-height: 1;
            transition: transform 180ms var(--motion-ease), background 180ms ease, color 180ms ease, box-shadow 180ms ease;
            box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.08);
        }

        .like-button:active .like-icon,
        .like-button.is-liked .like-icon {
            transform: scale(1.18) rotate(-8deg);
            background: rgba(239, 68, 68, 0.18);
            color: #dc2626;
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
        }

        .like-button.is-liked {
            border-color: rgba(239, 68, 68, 0.32);
            background: linear-gradient(135deg, rgba(254, 242, 242, 0.98), rgba(255, 255, 255, 0.96));
        }

        .dark .like-button.is-liked {
            border-color: rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, rgba(69, 10, 10, 0.9), rgba(24, 24, 27, 0.96));
        }

        .like-button .like-count {
            min-width: 1.2rem;
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

        function getSafeProfileImageUrl(rawUrl) {
            return AppSecurity.safeImageUrl(rawUrl) || defaultAvatar;

        function getProfilePhotoCandidates(user) {
            return [user && user.photoURL, user && user.image, user && user.avatarURL, user && user.profileImage, user && user.avatar]
                .map(value => AppSecurity.safeImageUrl(value))
                .filter((value, index, values) => value && values.indexOf(value) === index);
        }

        function setProfileAvatarImage(image, user, altText) {
            const candidates = getProfilePhotoCandidates(user);
            let candidateIndex = 0;
            image.alt = altText || '';
            image.onerror = () => {
                if (candidateIndex < candidates.length) {
                    image.src = candidates[candidateIndex++];
                    return;
                }
                image.onerror = null;
                image.src = defaultAvatar;
            };
            image.src = candidates.length ? candidates[candidateIndex++] : defaultAvatar;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        function safeExternalUrl(rawUrl) {

            const safeName = safeUser.name || 'حسابي';
            sidebarProfile.href = 'profile.html';

            sidebarProfile.innerHTML = `
                <img src="${defaultAvatar}" alt="" class="h-10 w-10 rounded-full object-cover border border-gray-200 dark:border-neutral-700">

            const bottomProfileLink = document.getElementById('bottomProfileLink');

        async function loadSidebarUser() {
            if (!currentUser || !currentUser.id) {
                renderSidebarUser(null);
                return;
            }

            const localUser = {
                ...currentUser,
                id: currentUser.id,
                name: currentUser.name || 'حسابي',
                photoURL: currentUser.photoURL || currentUser.image || currentUser.avatarURL || currentUser.profileImage || currentUser.avatar || ''
            };
            renderSidebarUser(localUser);

            if (!db || !firebaseConfigured) {
                return;
            }

            try {
                await firebaseAuthReady;
                const userDoc = await db.collection('users').doc(currentUser.id).get();
                if (!userDoc.exists) {
                    return;
                }

                const firestoreUser = userDoc.data() || {};
                if (AppSecurity.isGuest(currentUser) && firestoreUser.name === 'ضيف') {
                    await db.collection('users').doc(currentUser.id).set({name: ''}, {merge: true});
                }
                const photoURL = firestoreUser.photoURL || firestoreUser.image || firestoreUser.avatarURL || firestoreUser.profileImage || firestoreUser.avatar || currentUser.photoURL || currentUser.image || currentUser.avatarURL || currentUser.profileImage || currentUser.avatar || '';
                const nextUser = {
                    ...currentUser,
                    id: currentUser.id,
                    name: AppSecurity.isGuest(currentUser) ? '' : (firestoreUser.name || currentUser.name || 'حسابي'),
                    photoURL: photoURL,
                    image: firestoreUser.image || currentUser.image || ''
                };

                currentUser = {...currentUser, name: nextUser.name, photoURL};
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                renderSidebarUser(nextUser);

                console.error('فشل تحميل بيانات المستخدم في الـ Sidebar:', error);

        function renderDiscoverUsers(users, message) {
            const list = document.getElementById('discoverUsersList');
            const status = document.getElementById('discoverUsersMessage');
            if (!users.length) {
                list.classList.add('hidden');
                status.textContent = message || 'لا يوجد مستخدمون آخرون لعرضهم الآن.';
                status.classList.remove('hidden');
                return;
            }

            list.innerHTML = users.map(user => {
                const photo = escapeHtml(getSafeProfileImageUrl(user.photoURL || user.image || ''));
                const name = escapeHtml(user.name || 'بدون اسم');
                return `<a href="profile.html?uid=${encodeURIComponent(user.id)}" class="flex w-[4.5rem] shrink-0 snap-start flex-col items-center gap-1.5 text-center" aria-label="الملف الشخصي: ${name}">
                    <span class="rounded-full bg-gradient-to-br from-blue-500 via-cyan-400 to-emerald-400 p-[2px]">
                        <img src="${photo}" alt="" loading="lazy" decoding="async" class="h-14 w-14 rounded-full border-2 border-white bg-gray-100 object-cover dark:border-neutral-900" onerror="this.onerror=null;this.src='${defaultAvatar}';">
                    </span>
                    <span class="w-full truncate text-[10px] text-gray-700 dark:text-gray-300">${name}</span>
                </a>`;

        async function loadDiscoverUsers() {
            const status = document.getElementById('discoverUsersMessage');
            status.textContent = 'جارٍ تحميل المستخدمين...';
            status.classList.remove('hidden');
            try {
                let users = [];
                if (db && firebaseConfigured) {
                    await firebaseAuthReady;
                    const snapshot = await db.collection('users').limit(100).get();
                    snapshot.forEach(doc => {
                        const user = {id: doc.id, ...doc.data()};
                        userProfiles[user.id] = user;
                        users.push(user);
                    });
                } else {
                    users = JSON.parse(localStorage.getItem('app_users') || '[]');
                }

                users = users.filter(user => user.id && String(user.id) !== String(currentUser.id) && user.status !== 'banned' && (AppSecurity.isGuest(currentUser) || (user.isGuest !== true && user.role !== 'guest')));
                renderDiscoverUsers(users.slice(0, 24));
            } catch (error) {
                console.error('تعذر تحميل شريط المستخدمين:', error);
                renderDiscoverUsers([], 'تعذر تحميل المستخدمين الآن.');

        async function handleImageSelect(event) {
            const files = Array.from(event.target.files);
            if (!files.length) {
                removeSelectedImage();
                return;
            }

            const pdfFiles = files.filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
            if (pdfFiles.length > 0) {
                if (files.length !== 1) {
                    alert('يرجى اختيار ملف PDF واحد فقط في المنشور.');
                    event.target.value = '';
                    return;
                }
                if (pdfFiles[0].size > 5 * 1024 * 1024) {
                    alert('حجم ملف PDF يجب ألا يتجاوز 5 ميجابايت.');
                    event.target.value = '';
                    return;
                }

                let pdfSignature = '';
                try {
                    pdfSignature = await pdfFiles[0].slice(0, 1024).text();
                } catch (_) {}
                if (!pdfSignature.includes('%PDF-')) {
                    alert('الملف المحدد لا يحتوي على توقيع PDF صالح.');
                    event.target.value = '';
                    removeSelectedImage();
                    return;
                }

                selectedImagesBase64 = [];
                selectedImageFiles = [];
                selectedPdf = { name: pdfFiles[0].name, file: pdfFiles[0] };
                document.getElementById('imagePreview').innerHTML = `<div class="col-span-full rounded border border-gray-300 dark:border-neutral-600 p-3 text-xs">📄 ${escapeHtml(pdfFiles[0].name)}</div>`;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                return;
            }

            selectedPdf = null;

            const unsupportedImage = files.some(file => !/^image\/(?:png|jpeg|webp|gif)$/i.test(file.type));
            const totalImageSize = files.reduce((total, file) => total + file.size, 0);
            if (unsupportedImage) {
                alert('تُقبل الصور بصيغ PNG أو JPEG أو WebP أو GIF فقط.');
                event.target.value = '';
                removeSelectedImage();
                return;
            }
            if (files.some(file => file.size > 10 * 1024 * 1024) || totalImageSize > 25 * 1024 * 1024) {
                alert('يجب ألا يتجاوز حجم الصورة 10 ميجابايت، ومجموع الصور 25 ميجابايت.');
                event.target.value = '';
                removeSelectedImage();
                return;
            }

            if (files.length > 10) {
                alert('عذراً، الحد الأقصى المسموح به هو 10 صور فقط في المنشور الواحد!');
                event.target.value = '';
                removeSelectedImage();
                return;
            }

            selectedImagesBase64 = [];
            selectedImageFiles = [];
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';

            imageProcessingPromise = Promise.all(files.map(async file => {
                const image = document.createElement('img');
                image.src = URL.createObjectURL(file);
                image.className = 'w-full h-24 object-cover rounded border';
                preview.appendChild(image);
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                try {
                    const compressedFile = file.size <= 200 * 1024 ? file : await imageCompression(file, {
                        maxSizeMB: 0.2,
                        maxWidthOrHeight: 2000,
                        useWebWorker: true,
                        initialQuality: 0.9
                    });
                    selectedImageFiles.push(compressedFile);
                    selectedImagesBase64.push(await fileToDataUrl(compressedFile));
                } catch (error) {
                    alert('تعذر ضغط إحدى الصور، يرجى المحاولة مرة أخرى.');
                    removeSelectedImage();
                    throw error;
                }
            }));
        }

        function removeSelectedImage() {
            selectedImagesBase64 = [];
            selectedImageFiles = [];
            imageProcessingPromise = Promise.resolve();
            selectedPdf = null;
            document.getElementById('postImage').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function getLocalDateValue() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${now.getFullYear()}-${month}-${day}`;
        }

        function openPostComposer() {
            const modal = document.getElementById('postComposerModal');
            if (isSubmittingPost) return;
            const dateInput = document.getElementById('newPostDate');
            if (!dateInput.value) dateInput.value = getLocalDateValue();
            document.getElementById('postFormStatus').textContent = '';
            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            requestAnimationFrame(() => modal.classList.add('is-open'));
            document.getElementById('postText').focus();
        }

        function closePostComposer(force = false) {
            if (isSubmittingPost && !force) return;
            const modal = document.getElementById('postComposerModal');
            if (modal.classList.contains('hidden')) return;
            modal.classList.remove('is-open');
            document.body.classList.remove('overflow-hidden');
            setTimeout(() => {
                if (!modal.classList.contains('is-open')) modal.classList.add('hidden');
            }, 220);
            document.getElementById('openPostComposer').focus();
        }

        function showAppToast(message, isError = false) {
            const toast = document.getElementById('appToast');
            toast.textContent = message;
            toast.classList.toggle('bg-red-700', isError);
            toast.classList.toggle('bg-gray-900', !isError);
            toast.classList.remove('hidden');
            clearTimeout(appToastTimeout);
            appToastTimeout = setTimeout(() => toast.classList.add('hidden'), 3200);
        }

        async function createNewPost() {
            if (AppSecurity.notifyGuestAction('النشر', currentUser)) return;
            if (isSubmittingPost) return;
            const text = document.getElementById('postText').value.trim();
            const grade = document.getElementById('newPostGrade').value;
            const subject = document.getElementById('newPostSubject').value;
            const studyDate = document.getElementById('newPostDate').value;
            const isAnonymous = document.getElementById('isAnonymousInput').checked;
            const status = document.getElementById('postFormStatus');
            const publishButton = document.getElementById('publishPostButton');
            const hasSelectedFile = document.getElementById('postImage').files.length > 0;

            if (!text && selectedImageFiles.length === 0 && !selectedPdf && !hasSelectedFile) {
                status.textContent = 'اكتب وصفاً أو اختر صورة أو ملف PDF قبل النشر.';
                return;
            }
            if (!studyDate) {
                status.textContent = 'يرجى تحديد تاريخ المادة.';
                return;
            }

            const normalizedText = text.toLowerCase();
            const foundBannedWord = bannedWords.find(word => word && normalizedText.includes(word.toLowerCase()));
            if (foundBannedWord) {
                status.textContent = 'لا يمكن نشر المنشور لأنه يحتوي على كلمة ممنوعة.';
                return;
            }

            isSubmittingPost = true;
            publishButton.disabled = true;
            publishButton.textContent = 'جارٍ النشر...';
            status.textContent = '';
            try {
                await imageProcessingPromise;
                let imageUrls = selectedImagesBase64;
                let pdfURL = selectedPdf && selectedPdf.data;
                if (db) {
                    await firebaseAuthReady;
                    imageUrls = await Promise.all(selectedImageFiles.map(file => uploadToCloudinary(file, 'image')));
                    if (selectedPdf) pdfURL = await uploadToCloudinary(selectedPdf.file, 'raw');
                } else if (selectedPdf && selectedPdf.file) {
                    pdfURL = await fileToDataUrl(selectedPdf.file);
                }

                const newPost = {
                    id: 'post_' + Date.now(),
                    authorId: currentUser.id,
                    authorName: currentUser.name,
                    isAnonymous: isAnonymous,
                    grade: grade,
                    subject: subject,
                    studyDate: studyDate,
                    time: new Date().toLocaleString(window.getSiteLocale()),
                    text: text,
                    images: imageUrls,
                    pdf: selectedPdf ? {name: selectedPdf.name, data: pdfURL} : null
                };

                if (db) {
                    await db.collection('posts').add({
                        authorId: currentUser.id,
                        authorName: currentUser.name,
                        isAnonymous: isAnonymous,
                        grade: grade,
                        subject: subject,
                        studyDate: studyDate,
                        time: firebase.firestore.FieldValue.serverTimestamp(),
                        text: text,
                        images: imageUrls,
                        pdfURL: pdfURL || null,
                        pdfName: selectedPdf ? selectedPdf.name : null
                    });
                } else {
                    const posts = JSON.parse(localStorage.getItem('app_posts') || '[]');
                    posts.unshift(newPost);
                    localStorage.setItem('app_posts', JSON.stringify(posts));
                    renderPostsFromCloud(posts);
                }

                document.getElementById('postText').value = '';
                document.getElementById('isAnonymousInput').checked = false;
                document.getElementById('newPostDate').value = getLocalDateValue();
                removeSelectedImage();
                closePostComposer(true);
                showAppToast('تم نشر المادة بنجاح.');
            } catch (error) {
                console.error('تعذر نشر المادة:', error);
                status.textContent = `تعذر النشر: ${error.message || 'حدث خطأ غير متوقع. تحقق من الاتصال ثم حاول مجدداً.'}`;
                showAppToast('تعذر النشر. بقيت بيانات النموذج كما هي.', true);
            } finally {
                isSubmittingPost = false;
                publishButton.disabled = false;
                publishButton.textContent = 'نشر في الأرشيف';
            }
        }

        function normalizeCloudinaryDownloadUrl(url, fallbackName) {
            if (!url) return '';
            if (url.startsWith('data:')) return url;
            if (!/cloudinary\.com|res\.cloudinary\.com/i.test(url) || url.includes('fl_attachment')) return url;
            if (url.includes('/upload/')) {
                return url.replace('/upload/', '/upload/fl_attachment/');
            }
            return `${url}${url.includes('?') ? '&' : '?'}download=${encodeURIComponent(fallbackName || 'molakhasati-file')}`;
        }

        function getFilteredPosts(posts) {
            const gradeFilter = document.getElementById('gradeFilter').value;
            const subjectFilter = document.getElementById('subjectFilter').value;
            const basePosts = posts || JSON.parse(localStorage.getItem('app_posts') || '[]');

            return basePosts.filter(post => {
                const matchGrade = (gradeFilter === 'all' || post.grade === gradeFilter);
                const matchSubject = (subjectFilter === 'all' || post.subject === subjectFilter);
                return matchGrade && matchSubject;
            });
        }

        function renderPostsFromCloud(cloudPosts) {
            const feedContainer = document.getElementById('postsFeed');
            const posts = cloudPosts || JSON.parse(localStorage.getItem('app_posts') || '[]');
            const filteredPosts = getFilteredPosts(posts);

            feedContainer.innerHTML = '';

            if (filteredPosts.length === 0) {
                feedContainer.innerHTML = `
                    <div class="bg-white dark:bg-neutral-900 p-8 rounded-lg border border-gray-200 dark:border-neutral-800 text-center text-gray-500 text-xs">
                        لا توجد منشورات حالياً.
                    </div>`;
                return;
            }

            filteredPosts.forEach(post => {
                const displayName = post.isAnonymous ? 'مجهول (Anonymous)' : escapeHtml(post.authorName || 'بدون اسم');
                const authorProfile = post.isAnonymous ? null : userProfiles[post.authorId];
                const authorPhoto = getSafeProfileImageUrl(authorProfile?.photoURL || '');
                const authorLink = post.isAnonymous
                    ? `<span class="font-bold text-xs text-gray-500 italic">${displayName}</span>`
                    : `<a href="profile.html?uid=${encodeURIComponent(post.authorId || '')}" class="inline-flex items-center gap-2 hover:underline"><img src="${authorPhoto}" alt="" class="w-7 h-7 rounded-full object-cover border border-gray-200 dark:border-neutral-700" onerror="this.onerror=null;this.src='${defaultAvatar}';"><span class="font-bold text-xs">${displayName}</span></a>`;

                const rawPdfUrl = post.pdfURL || (post.pdf && post.pdf.data) || '';
                const pdfUrl = AppSecurity.safePdfUrl(rawPdfUrl);
                const pdfName = post.pdfName || (post.pdf && post.pdf.name) || 'molakhasati-file.pdf';
                const safePdfName = escapeHtml(pdfName);
                const pdfDownloadHref = normalizeCloudinaryDownloadUrl(pdfUrl, pdfName);

                const postElement = document.createElement('div');
                postElement.className = "bg-white dark:bg-neutral-900 rounded-lg border border-gray-200 dark:border-neutral-800 overflow-hidden";
                postElement.id = `post-${post.id}`;
                postElement.innerHTML = `
                    <div class="p-3 border-b border-gray-100 dark:border-neutral-800 flex items-center justify-between gap-3">
                        <div>
                            ${authorLink}
                            <p class="text-[10px] text-gray-400 mt-0.5">
                                <span>${escapeHtml(post.grade || '')}</span> • <span>${escapeHtml(post.subject || '')}</span> • ${post.studyDate ? `تاريخ المادة: ${formatStudyDate(post.studyDate)} • ` : ''}${formatPostTime(post.time)}
                            </p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" data-like-id="${escapeHtml(post.id)}" data-like-count="${getPostLikeCount(post)}" class="like-button ${Number(getLikeStateStore()[String(post.id)] || getPostLikeCount(post)) > 0 ? 'is-liked' : ''}" aria-label="الإعجاب بالمنشور">
                                <span class="like-icon">♥</span>
                                <span class="like-count">${getLikeStateStore()[String(post.id)] || getPostLikeCount(post)}</span>
                            </button>
                            <button type="button" data-bookmark-id="${escapeHtml(post.id)}" class="text-xs text-blue-700 dark:text-blue-400 hover:underline">${isBookmarked(post.id) ? 'إزالة الحفظ' : 'حفظ المنشور'}</button>
                        </div>
                    </div>
                    ${post.text ? `<div class="p-3 text-xs leading-relaxed">${escapeHtml(post.text)}</div>` : ''}
                    ${pdfUrl ? `<div class="p-3 flex items-center justify-between gap-3"><a href="${pdfUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-xs text-blue-700 dark:text-blue-400 underline">📄 ${safePdfName}</a><a href="${pdfDownloadHref}" download="${safePdfName}" class="inline-flex items-center gap-1 text-[10px] text-blue-700 dark:text-blue-400 underline">⬇ تحميل PDF</a></div>` : ''}
                    ${post.images && post.images.length > 0 ? `
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2 p-3">
                            ${post.images.map((img, index) => {
                                const safeImg = AppSecurity.safeImageUrl(img);
                                if (!safeImg) return '';
                                const imageName = `molakhasati-image-${index + 1}${safeImg.includes('.') ? (safeImg.match(/\.[a-zA-Z0-9]+(?:\?.*)?$/)?.[0] || '.jpg') : '.jpg'}`;
                                const downloadHref = normalizeCloudinaryDownloadUrl(safeImg, imageName);
                                return `
                                    <div class="space-y-2">
                                        <img src="${safeImg}" alt="صورة منشور" class="w-full h-32 object-cover rounded-lg border border-gray-200 dark:border-neutral-700">
                                        <div class="flex items-center justify-between gap-2 px-1">
                                            <a href="${safeImg}" target="_blank" rel="noopener" class="text-[10px] text-blue-700 dark:text-blue-400 underline">عرض</a>
                                            <button type="button" data-download-image="${escapeHtml(safeImg)}" data-download-name="${escapeHtml(imageName)}" class="inline-flex items-center gap-1 text-[10px] text-blue-700 dark:text-blue-400 underline">
                                                <svg aria-hidden="true" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
                                                تحميل
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : (AppSecurity.safeImageUrl(post.image) ? `<img src="${escapeHtml(AppSecurity.safeImageUrl(post.image))}" alt="صورة منشور" class="w-full max-h-80 object-cover border-t border-gray-100 dark:border-neutral-800">` : '')}
                    ${renderPostComments(post)}
                `;
                feedContainer.appendChild(postElement);
            });
        }

        function formatPostTime(time) {
            if (!time) return 'جارٍ الحفظ...';
            if (typeof time.toDate === 'function') return time.toDate().toLocaleString(window.getSiteLocale());
            return escapeHtml(time);
        }

        function formatStudyDate(dateValue) {
            const date = new Date(`${dateValue}T00:00:00`);
            return Number.isNaN(date.getTime()) ? escapeHtml(dateValue) : date.toLocaleDateString(window.getSiteLocale());
        }

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function uploadToCloudinary(file, resourceType) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            console.log('Uploading to Cloudinary...', {resourceType, size: file.size, type: file.type});
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`, {method: 'POST', body: formData});
            const result = await response.json();
            if (!response.ok || !result.secure_url) {
                const error = new Error(result.error?.message || 'Cloudinary upload failed');
                error.code = `cloudinary/${response.status}`;
                throw error;
            }
            console.log('Cloudinary upload successful:', result.secure_url);
            return result.secure_url;
        }

        async function downloadImageWithWatermark(sourceUrl, fileName, button) {
            const safeUrl = AppSecurity.safeImageUrl(sourceUrl);
            if (!safeUrl) {
                showAppToast('تعذر تجهيز الصورة للتنزيل.', true);
                return;
            }

            const originalContent = button.innerHTML;
            button.disabled = true;
            button.textContent = 'جارٍ التجهيز...';
            let bitmapUrl = null;
            let downloadUrl = null;
            try {
                const response = await fetch(safeUrl, {mode: 'cors', credentials: 'omit'});
                if (!response.ok) throw new Error('تعذر جلب الصورة من مصدرها.');
                const sourceBlob = await response.blob();
                if (!sourceBlob.type.startsWith('image/')) throw new Error('المصدر ليس ملف صورة صالحاً.');

                let image;
                if (typeof createImageBitmap === 'function') {
                    image = await createImageBitmap(sourceBlob);
                } else {
                    bitmapUrl = URL.createObjectURL(sourceBlob);
                    image = new Image();
                    image.src = bitmapUrl;
                    await image.decode();
                }

                const canvas = document.createElement('canvas');
                canvas.width = image.width || image.naturalWidth;
                canvas.height = image.height || image.naturalHeight;
                const context = canvas.getContext('2d');
                if (!context || !canvas.width || !canvas.height) throw new Error('تعذر إنشاء نسخة قابلة للتنزيل.');
                context.drawImage(image, 0, 0);
                if (typeof image.close === 'function') image.close();

                const fontSize = Math.max(12, Math.min(42, Math.round(canvas.width * 0.022)));
                const padding = Math.ceil(fontSize * 0.55);
                const margin = Math.max(8, Math.ceil(fontSize * 0.65));
                const isEnglish = window.getSiteLocale() === 'en-US';
                const watermark = isEnglish ? 'Molakhasati' : 'منصة ملخصاتي';
                context.font = `600 ${fontSize}px Arial, sans-serif`;
                context.direction = isEnglish ? 'ltr' : 'rtl';
                context.textAlign = isEnglish ? 'left' : 'right';
                context.textBaseline = 'top';
                const textWidth = context.measureText(watermark).width;
                const boxWidth = textWidth + padding * 2;
                const boxHeight = fontSize + padding * 2;
                context.fillStyle = 'rgba(15, 23, 42, 0.58)';
                context.fillRect(isEnglish ? margin : canvas.width - margin - boxWidth, margin, boxWidth, boxHeight);
                context.fillStyle = 'rgba(255, 255, 255, 0.92)';
                context.fillText(watermark, isEnglish ? margin + padding : canvas.width - margin - padding, margin + padding);

                const outputType = ['image/jpeg', 'image/png', 'image/webp'].includes(sourceBlob.type)
                    ? sourceBlob.type
                    : 'image/png';
                const outputBlob = await new Promise((resolve, reject) => {
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('تعذر تصدير الصورة.')), outputType, 0.94);
                });
                const actualOutputType = ['image/jpeg', 'image/png', 'image/webp'].includes(outputBlob.type)
                    ? outputBlob.type
                    : 'image/png';
                downloadUrl = URL.createObjectURL(outputBlob);
                const extension = actualOutputType === 'image/jpeg' ? 'jpg' : actualOutputType.split('/')[1];
                const baseName = (fileName || 'molakhasati-image').replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]/g, '_');
                const anchor = document.createElement('a');
                anchor.href = downloadUrl;
                anchor.download = `${baseName}-molakhasati.${extension}`;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                showAppToast('تم تجهيز الصورة بعلامة منصة ملخصاتي.');
            } catch (error) {
                console.error('تعذر تنزيل الصورة بعلامة مائية:', error);
                showAppToast('تعذر تجهيز الصورة. تحقق من اتصال المصدر أو صلاحية CORS.', true);
            } finally {
                if (bitmapUrl) URL.revokeObjectURL(bitmapUrl);
                button.disabled = false;
                button.innerHTML = originalContent;
            }
        }

        function renderPosts() {
            renderPostsFromCloud();
        }

        setCommentsContext(db, currentUser);

        function listenForPosts() {
            if (!db) {
                renderPostsFromCloud();
                return;
            }
            db.collection('posts').orderBy('time', 'desc').onSnapshot(snapshot => {
                const cloudPosts = [];
                snapshot.forEach(doc => {
                    const post = {id: doc.id, ...doc.data()};
                    cloudPosts.push(post);
                    if (!post.isAnonymous && post.authorId && !userProfiles[post.authorId]) {
                        db.collection('users').doc(post.authorId).get().then(userDoc => {
                            if (userDoc.exists) {
                                userProfiles[post.authorId] = userDoc.data();
                                renderPostsFromCloud(cloudPosts);
                            }
                        });
                    }
                });
                renderPostsFromCloud(cloudPosts);
            }, error => {
                console.error('تعذر جلب المنشورات من Firestore:', error);
                renderPostsFromCloud();
            });
        }

        function getBookmarks() {
            return JSON.parse(localStorage.getItem('bookmarked_posts') || '[]');
        }

        function isBookmarked(postId) {
            return getBookmarks().includes(postId);
        }

        function getPostLikeCount(post) {
            if (typeof post.likeCount === 'number') return post.likeCount;
            if (Array.isArray(post.likedBy)) return post.likedBy.length;
            if (typeof post.likes === 'number') return post.likes;
            return 0;
        }

        function getLikeStateStore() {
            try {
                return JSON.parse(localStorage.getItem('post_like_state') || '{}');
            } catch (error) {
                return {};
            }
        }

        function updateLikeState(postId, count) {
            const nextState = getLikeStateStore();
            nextState[String(postId)] = Number(count) || 0;
            localStorage.setItem('post_like_state', JSON.stringify(nextState));
            return nextState[String(postId)];
        }

        async function bumpLike(postId, triggerButton = null) {
            const likeState = getLikeStateStore();
            const safePostId = String(postId);
            const currentCount = Number(likeState[safePostId] || 0);
            const nextCount = currentCount + 1;
            updateLikeState(safePostId, nextCount);

            if (triggerButton) {
                triggerButton.dataset.likeCount = String(nextCount);
                triggerButton.classList.add('is-liked');
                const countNode = triggerButton.querySelector('.like-count');
                if (countNode) countNode.textContent = String(nextCount);
            }

            try {
                if (db && firebaseConfigured) {
                    await firebaseAuthReady;
                    await db.collection('posts').doc(postId).update({
                        likeCount: firebase.firestore.FieldValue.increment(1)
                    });
                }
            } catch (error) {
                console.error('تعذر تحديث عدد اللايكات:', error);
            }
        }

        function toggleBookmark(postId) {
            if (AppSecurity.notifyGuestAction('الحفظ', currentUser)) return;
            const bookmarks = getBookmarks();
            const nextBookmarks = bookmarks.includes(postId)
                ? bookmarks.filter(id => id !== postId)
                : [...bookmarks, postId];
            localStorage.setItem('bookmarked_posts', JSON.stringify(nextBookmarks));
            renderPosts();
        }

        document.getElementById('postsFeed').addEventListener('click', event => {
            const downloadButton = event.target.closest('[data-download-image]');
            if (downloadButton) {
                downloadImageWithWatermark(downloadButton.dataset.downloadImage, downloadButton.dataset.downloadName, downloadButton);
                return;
            }

            const likeButton = event.target.closest('[data-like-id]');
            if (likeButton) {
                bumpLike(likeButton.dataset.likeId, likeButton).catch(() => {});
                return;
            }

            const button = event.target.closest('[data-bookmark-id]');
            if (button) toggleBookmark(button.dataset.bookmarkId);
        });

        function openUserSearch() {
            document.getElementById('userSearchModal').classList.remove('hidden');
            document.getElementById('userSearchInput').focus();
            searchUsers();
        }

        function closeUserSearch() {
            document.getElementById('userSearchModal').classList.add('hidden');
        }

        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') return;
            if (!document.getElementById('postComposerModal').classList.contains('hidden')) {
                closePostComposer();
            } else if (!document.getElementById('userSearchModal').classList.contains('hidden')) {
                closeUserSearch();
            }
        });

        document.getElementById('discoverUsersList').addEventListener('wheel', event => {
            if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
                event.currentTarget.scrollLeft += event.deltaY;
                event.preventDefault();
            }
        }, {passive: false});

        async function searchUsers() {
            const results = document.getElementById('userSearchResults');
            const query = document.getElementById('userSearchInput').value.trim().toLowerCase();
            results.innerHTML = '<p class="text-center text-xs text-gray-500">جارٍ البحث...</p>';
            if (!db) {
                results.innerHTML = '<p class="text-center text-xs text-gray-500">البحث متاح بعد إعداد Firebase.</p>';
                return;
            }
            try {
                const snapshot = await db.collection('users').limit(100).get();
                const users = [];
                snapshot.forEach(doc => {
                    const user = {id: doc.id, ...doc.data()};
                    userProfiles[user.id] = user;
                    const visibleToCurrentUser = AppSecurity.isGuest(currentUser) || (user.isGuest !== true && user.role !== 'guest');
                    if (visibleToCurrentUser && (!query || String(user.name || '').toLowerCase().includes(query))) users.push(user);
                });
                results.innerHTML = users.length ? users.map(user => {
                    const photo = getSafeProfileImageUrl(user.photoURL || '');
                    return `<a href="profile.html?uid=${encodeURIComponent(user.id)}" class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-neutral-700">
                        <img src="${photo}" alt="" class="w-9 h-9 rounded-full object-cover" onerror="this.onerror=null;this.src='${defaultAvatar}';">
                        <span>
                            <strong class="block text-xs">${escapeHtml(user.name || 'بدون اسم')}</strong>
                            <small class="text-[10px] text-gray-500">${escapeHtml(user.bio || '')}</small>
                        </span>
                    </a>`;
                }).join('') : '<p class="text-center text-xs text-gray-500">لا توجد نتائج.</p>';
            } catch (error) {
                console.error('User search failed:', error);
                results.innerHTML = `<p class="text-center text-xs text-red-600">تعذر البحث: ${escapeHtml(error.message)}</p>`;
            }
        }

        listenForPosts();
    </script>
    <span aria-hidden="true" class="pointer-events-none fixed bottom-[calc(4.5rem+env(safe-area-inset-bottom))] right-2 z-[25] select-none text-[9px] leading-none text-gray-500/50 dark:text-gray-400/45">الإصدار 2.12.0</span>
</body>
